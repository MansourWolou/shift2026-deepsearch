[project]
name = "shift2026"
version = "0.1.0"
description = "Multi-agent fact-checking engine"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.1.12",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "black>=25.0",
    "ruff>=0.11",
    "pre-commit>=4.0",
]

# ── Black ──────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]

# ── Ruff (lint + isort) ────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by black
    "SIM108", # ternary — sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["factcheck"]
